name: Check

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: check-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Application and database checks
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
              with:
                  version: 10.33.2
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.13.0
                  cache: pnpm

            - name: Install just
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
              with:
                  just-version: 1.43.1

            - name: Install OpenTofu
              uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
              with:
                  tofu_version: 1.11.5
                  tofu_wrapper: false

            - name: Initialize infrastructure providers without hosted credentials
              run: just infrastructure-init

            - name: Install locked dependencies
              run: just install

            - name: Start local Supabase
              run: just database-start

            - name: Install browser
              run: just browser-install

            - name: Run application and database checks
              run: just check

            - name: Stop local Supabase
              if: always()
              run: just database-stop
